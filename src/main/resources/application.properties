spring.application.name=chatapi
server.port=8080

external.api.quote-url=https://dummyjson.com/quotes/random

openai.api.base-url=https://api.openai.com/v1/responses
openai.api.key=${OPENAI_API_KEY}
openai.model=gpt-5.4

chat.memory.max-history-size=10

chat.prompt.system=You are a helpful backend development mentor. Answer clearly and practically. Keep answers concise unless the user asks for details. Focus on Java, Spring Boot, REST APIs, backend architecture, and AI integration.
chat.prompt.no-history-message=Conversation history for this session: NONE

retry.openai.max-attempts=3
retry.openai.delay-ms=500